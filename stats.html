<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ハマパレ｜アンケート集計</title><style>body{margin:0;background:#f6f2e9;color:#111d42;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}header{background:#0d193e;color:white;padding:32px 18px;border-bottom:7px solid #57d4cf}main{max-width:850px;margin:auto;padding:20px 16px 80px}h1{font-size:26px;margin:8px 0}h2{font-size:19px}.eyebrow{color:#f6a038;font-weight:800;letter-spacing:2px;font-size:12px}.intro{line-height:1.8;color:#53617d}.card{background:#fff;border:2px solid #18234c;border-radius:20px;padding:20px;margin:20px 0;box-shadow:5px 6px 0 #f49c36}.barrow{margin:13px 0}.barlabel{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:600}.track{height:12px;background:#edf1f6;border-radius:99px;overflow:hidden;margin-top:7px}.fill{height:100%;background:linear-gradient(90deg,#3874e9,#54c8c6);border-radius:99px}.status{padding:22px;background:#fff;border-radius:15px;line-height:1.7}a{color:#2454c9}footer{color:#64718a;font-size:12px;margin-top:30px;line-height:1.8}button{background:#f49c36;border:2px solid #111d42;border-radius:12px;padding:11px 20px;font-weight:700;color:#111d42}</style></head><body><header><div class="eyebrow">HAMAPARE 2027 / RESEARCH</div><h1>ハマパレ アンケート集計</h1><div>音楽・振付・参加意向をみんなで分析</div></header><main><p class="intro">回答内容の傾向を確認できる集計専用ページです。氏名・自由記述・個別回答は表示しません。URLを知っている人は誰でも閲覧できます。</p><div id="status" class="status">集計データを読み込んでいます…</div><div id="charts"></div><button onclick="load()">集計を更新</button><footer>集計値は回答が10件以上集まるまで非表示です。5件未満の選択肢は表示しません。URLを知らない人もアクセスできる可能性があるため、ここに表示される内容は公開情報として扱ってください。</footer></main><script>const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const st=document.getElementById('status'),el=document.getElementById('charts');st.textContent='集計データを読み込んでいます…';el.innerHTML='';try{const r=await fetch('/api/stats',{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'取得できません');if(!d.ready){st.textContent=d.message;return}st.textContent=d.note;el.innerHTML=d.groups.map(g=>{const max=Math.max(...g.items.map(x=>x.count));return `<section class="card"><h2>${esc(g.title)}</h2>${g.items.map(x=>`<div class="barrow"><div class="barlabel"><span>${esc(x.label)}</span><span>${x.count}件</span></div><div class="track"><div class="fill" style="width:${100*x.count/max}%"></div></div></div>`).join('')}</section>`}).join('')||'<p>表示可能な集計がまだありません。</p>'}catch(e){st.textContent='読み込みエラー：'+e.message}}load();</script></body></html>
