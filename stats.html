<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ハマパレ｜回答結果</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f0e6;color:#14234a;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}header{background:#111d44;color:#fff;padding:25px 18px;border-bottom:7px solid #55d0c8}header small{color:#ffad4d;font-weight:800;letter-spacing:2px}h1{font-size:26px;margin:10px 0}main{max-width:950px;margin:auto;padding:18px 14px 80px}.card{background:#fff;border-radius:18px;padding:19px;margin:14px 0;box-shadow:0 3px 12px #16234a14}h2{font-size:18px;margin:0 0 16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}button{background:#f6a03b;border:2px solid #132149;border-radius:12px;color:#132149;padding:12px 16px;font-weight:800;font-size:15px}button:disabled{opacity:.4}.muted{color:#66738b;font-size:13px;line-height:1.8}.row{margin:13px 0}.lbl{display:flex;justify-content:space-between;gap:12px;font-size:14px}.track{height:11px;border-radius:20px;background:#e9eef5;margin-top:7px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#3474ed,#56d0c9)}#count{font-size:38px;font-weight:900}.error{color:#b43143}</style></head><body><header><small>HAMAPARE 2027</small><h1>アンケート回答結果</h1><div>集計グラフとCSV出力</div></header><main><section class="card"><h2>回答状況</h2><div id="count">—</div><p id="status" class="muted">読み込み中…</p><div class="toolbar"><button id="reload">最新の結果に更新</button><button id="csv" disabled>集計CSVを保存</button></div></section><div id="groups"></div><p class="muted">このURLは公開ページです。氏名・個別回答はここに表示しません。個人情報を含む全回答CSVはCloudflare D1の管理者画面から取得してください。</p></main><script>const $=id=>document.getElementById(id);let data=[];function el(t,c){let e=document.createElement(t);if(c)e.className=c;return e}function csv(){const rows=[['質問','選択肢','回答数']];for(const g of data)for(const x of g.items)rows.push([g.title,x.label,x.count]);const s='\uFEFF'+rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n');const u=URL.createObjectURL(new Blob([s],{type:'text/csv;charset=utf-8'}));const a=el('a');a.href=u;a.download='hamapare_aggregate_'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}async function load(){ $('status').textContent='集計データを読み込んでいます…';$('groups').replaceChildren();$('csv').disabled=true;try{const r=await fetch('/api/stats',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(j.error)throw Error(j.error);if(!j.ready){$('count').textContent='集計待ち';$('status').textContent=j.message||'回答が一定数集まると表示します。';return}data=j.groups||[];$('count').textContent='集計公開中';$('status').textContent='設問ごとの回答傾向を表示しています。';$('csv').disabled=!data.length;for(const g of data){const box=el('section','card');const h=el('h2');h.textContent=g.title;box.append(h);const max=Math.max(...g.items.map(x=>x.count),1);for(const x of g.items){const row=el('div','row'),label=el('div','lbl'),name=el('span'),num=el('strong'),track=el('div','track'),bar=el('div','bar');name.textContent=x.label;num.textContent=x.count+'件';bar.style.width=(100*x.count/max)+'%';label.append(name,num);track.append(bar);row.append(label,track);box.append(row)}$('groups').append(box)}}catch(e){$('count').textContent='取得エラー';$('status').textContent='集計を読み込めませんでした：'+e.message;$('status').className='error'}}$('reload').onclick=load;$('csv').onclick=csv;load();</script></body></html>
