<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ハマパレ｜回答分析</title><style>body{margin:0;background:#f6f2e9;color:#142449;font-family:-apple-system,BlinkMacSystemFont,sans-serif}header{background:#101c43;color:white;padding:24px 16px;border-bottom:6px solid #54d1c6}main{max-width:1100px;margin:auto;padding:14px}.card{background:white;border:1px solid #dce1e9;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 3px 14px #101c4310}h1{font-size:25px;margin:8px 0}h2{font-size:18px}button,input,select{font:inherit;border:1px solid #9ca8ba;border-radius:9px;padding:10px}button{background:#f5a03c;color:#142449;font-weight:700;cursor:pointer}button.secondary{background:white}.freeitem{border-bottom:1px solid #e6e9ef;padding:12px 0;line-height:1.7}.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.muted{color:#60708b;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.stat{background:#f5f8fc;border-radius:12px;padding:12px}.stat strong{font-size:26px}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px 8px;border-bottom:1px solid #e6e9ef;text-align:left;vertical-align:top}tr[data-id]{cursor:pointer}tr[data-id]:hover{background:#fff6e9}details{border-bottom:1px solid #eee;padding:10px 0}summary{font-weight:700;cursor:pointer}.bar{height:9px;background:#e8edf5;border-radius:6px;overflow:hidden}.fill{height:100%;background:#37a8bb}label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}input[type=file]{max-width:100%;box-sizing:border-box}#message{white-space:pre-wrap}footer{padding:20px;text-align:center;color:#69768c;font-size:12px}.tabs{display:flex;gap:5px;position:sticky;top:0;background:#f6f2e9;padding:10px 0;z-index:2}.tab{flex:1;background:white;border:1px solid #d9dfeb;font-size:14px;padding:13px 4px}.tab.active{background:#142449;color:white}.panel{min-height:240px}.status strong{font-size:14px}.scroll{max-height:65vh;overflow:auto}table{width:max-content;min-width:100%;border-collapse:collapse}th{background:#eaf0fa;position:sticky;top:0;white-space:nowrap}td{max-width:260px;min-width:100px;overflow-wrap:anywhere}td:first-child,th:first-child{position:sticky;left:0;background:white;z-index:1}th:first-child{background:#eaf0fa;z-index:3}.stat{font-size:14px}.stat strong{display:inline-block;margin-top:6px}#detail{margin-top:15px}.freeitem{white-space:pre-wrap}#allcharts details{margin-top:8px}.actions input{flex:1;min-width:180px}button{touch-action:manipulation}@media(max-width:600px){main{padding:9px}.card{padding:12px;margin:10px 0}.tabs{gap:3px}.tab{font-size:12px}header{padding:18px 14px}h1{font-size:22px}} </style></head><body><header><div style="color:#f6a13e;font-weight:800;letter-spacing:2px">HAMAPARE 2027</div><h1>回答分析ダッシュボード</h1><div>回答者一覧・全回答・集計・CSV出力</div></header><main>
<section class="card status"><div class="actions"><div><strong id="message">最新の回答を読み込み中…</strong></div><button id="fetch" class="secondary">↻ 最新の回答に更新</button></div></section>
<section id="dashboard" hidden>
<div class="grid"><div class="stat">総回答数<br><strong id="total">0</strong> 件</div><div class="stat">表示中<br><strong id="shown">0</strong> 件</div><div class="stat">回答項目<br><strong id="questions">0</strong></div></div>
<section class="card"><div class="actions"><input id="search" placeholder="氏名・回答内容を検索" aria-label="回答検索"><button id="csv">全回答CSVをダウンロード</button><button id="filtered" class="secondary">検索結果CSV</button><button id="json" class="secondary" hidden>JSON</button></div></section>
<nav class="tabs" aria-label="結果の表示切り替え"><button type="button" class="tab active" data-tab="summary">集計・グラフ</button><button type="button" class="tab" data-tab="free">自由回答</button><button type="button" class="tab" data-tab="sheet">回答一覧</button></nav>
<section class="card panel" id="panel-summary"><h2>質問別の回答数・割合</h2><div class="actions"><label for="question">質問を選択</label><select id="question"></select></div><div id="chart"></div><div id="allcharts"></div></section>
<section class="card panel" id="panel-free" hidden><h2>自由回答（回答者名付き）</h2><div id="freeanswers"></div></section>
<section class="card panel" id="panel-sheet" hidden><h2>全回答一覧</h2><p class="muted">横スクロールで全質問を確認できます。氏名をタップすると個別回答が開きます。</p><div class="scroll"><table><thead id="sheethead"></thead><tbody id="rows"></tbody></table></div><h2>個別回答</h2><div id="detail" class="muted">氏名をタップしてください。</div><div id="allanswers" hidden></div><button id="alltoggle" class="secondary" hidden>全回答を表示する</button></section>
</section></main><footer>個人情報を含むCSV・JSONは共有先に注意してください。</footer><script>
'use strict';let all=[],visible=[];const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>Array.isArray(v)?v.join('、'):v&&typeof v==='object'?JSON.stringify(v):String(v??'');const fields=r=>r.answers&&typeof r.answers==='object'?r.answers:{};const date=v=>{if(!v)return '';const d=new Date(String(v).replace(' ','T')+(String(v).includes('Z')?'':'Z'));return isNaN(d)?String(v):d.toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'})};
function normalize(x){const rows=Array.isArray(x)?x:Array.isArray(x.responses)?x.responses:Array.isArray(x.results)?x.results:Array.isArray(x.data)?x.data:[];return rows.map((r,i)=>{let a=r.answers??r.answers_json??{};if(typeof a==='string'){try{a=JSON.parse(a)}catch{a={raw:a}}}if(!a||typeof a!=='object')a={};if(!Object.keys(a).length){a={...r};['id','name','age','submitted_at'].forEach(k=>delete a[k])}return {id:r.id??i+1,name:r.name??a.name??'',age:r.age??a.age??'',submitted_at:r.submitted_at??'',answers:a}})}
function load(x){all=normalize(x);$('message').textContent=`${all.length}件を読み込みました。`; $('dashboard').hidden=false;const keys=[...new Set(all.flatMap(r=>Object.keys(fields(r))))];$('question').innerHTML=keys.map(k=>`<option value="${esc(k)}">${esc(label(k))}</option>`).join('');$('questions').textContent=keys.length;$('total').textContent=all.length;render()}
const labels={name:"氏名",age:"年齢",self_type:"自分のタイプ",selfType:"自分のタイプ",jcti:"JCTI",joined:"新入会員時の参加経験",joined_reason:"参加した理由",not_joined_reason:"参加しなかった理由",practice_count:"ダンス練習回数",float_review:"フロート制作の感想",experience_issues:"改善したい点",next_practice:"ダンス練習参加希望",dance_skills:"ダンスのスキル",float_skills:"フロート制作スキル",song_source:"楽曲の希望",lyric_theme:"歌詞に入れたいテーマ",lyric_free:"歌詞の自由記述",lyric_tone:"歌詞の雰囲気",song_genres:"音楽ジャンル",everyday_music:"普段聴く音楽",tiktok_example:"TikTokの例",join_level:"参加意欲"};const label=k=>labels[k]||k;const isFree=k=>/free|comment|other|reason|issue|opinion|text|message|detail|note/i.test(k);function renderFree(){const a=[];for(const r of visible){for(const [k,v] of Object.entries(fields(r))){if(isFree(k)&&fmt(v).trim()){a.push(`<div class="freeitem"><b>${esc(r.name)}（${esc(r.age)}歳）</b><div class="muted">${esc(label(k))}</div><div>${esc(fmt(v))}</div></div>`)}}}$("freeanswers").innerHTML=a.length?a.join(""):`<p class="muted">表示できる自由記述はありません（未回答の場合は空欄です）。</p>`}function render(){const q=$('search').value.trim().toLowerCase();visible=all.filter(r=>[r.name,r.age,JSON.stringify(r.answers)].join(' ').toLowerCase().includes(q));$('shown').textContent=visible.length;renderFree();const keys=[...new Set(all.flatMap(r=>Object.keys(fields(r))))].filter(k=>!['name','age'].includes(k));$('sheethead').innerHTML='<tr>'+['氏名','年齢','回答日時',...keys.map(label)].map(k=>'<th>'+esc(k)+'</th>').join('')+'</tr>';$('rows').innerHTML=visible.map(r=>`<tr data-id="${esc(r.id)}"><td><a href="#detail" class="person">${esc(r.name)}</a></td><td>${esc(r.age)}</td><td>${esc(date(r.submitted_at))}</td>${keys.map(k=>'<td>'+esc(fmt(fields(r)[k]))+'</td>').join('')}</tr>`).join('');document.querySelectorAll('tr[data-id]').forEach(el=>el.onclick=()=>detail(el.dataset.id));chart();if(!$('allanswers').hidden)showAll()}
function detail(id){const r=all.find(x=>String(x.id)===String(id));if(!r)return;$('detail').innerHTML=`<h3>${esc(r.name)}（ID: ${esc(r.id)}）</h3>`+Object.entries(fields(r)).map(([k,v])=>`<details open><summary>${esc(label(k))}</summary><div>${esc(fmt(v))}</div></details>`).join('');$('detail').scrollIntoView({behavior:'smooth',block:'start'})}
function showAll(){$('allanswers').innerHTML=visible.map(r=>`<details><summary>${esc(r.name)} / ID ${esc(r.id)}</summary>${Object.entries(fields(r)).map(([k,v])=>`<p><b>${esc(label(k))}</b>：${esc(fmt(v))}</p>`).join('')}</details>`).join('')}
function chart(){const key=$('question').value;const counts=new Map();for(const r of visible){const v=fields(r)[key];for(const item of (Array.isArray(v)?v:[v])){const s=fmt(item).trim();if(s)counts.set(s,(counts.get(s)||0)+1)}}const arr=[...counts].sort((a,b)=>b[1]-a[1]);const max=Math.max(1,...arr.map(x=>x[1]));$('chart').innerHTML=arr.length?arr.map(([k,n])=>`<div style="margin:12px 0"><div>${esc(k)} <b>${n}件（${visible.length?Math.round(n/visible.length*100):0}%）</b></div><div class="bar"><div class="fill" style="width:${n/max*100}%"></div></div></div>`).join(''):'<p class="muted">この項目の回答はありません。</p>'}
function download(name,data,type){const blob=new Blob([data],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
function csv(rows){const keys=[...new Set(all.flatMap(r=>Object.keys(fields(r))))];const head=['id','submitted_at','name','age',...keys.map(label)];const cell=v=>'"'+fmt(v).replace(/"/g,'""')+'"';download('hamapare_responses.csv','\ufeff'+[head.map(cell).join(','),...rows.map(r=>[r.id,r.submitted_at,r.name,r.age,...keys.map(k=>fields(r)[k])].map(cell).join(','))].join('\r\n'),'text/csv;charset=utf-8')}
function parseCSV(s){s=s.replace(/^\ufeff/,'');let rows=[],row=[],v='',quoted=false;for(let i=0;i<s.length;i++){const c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){v+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&s[i+1]==='\n')i++;row.push(v);if(row.some(x=>x!==''))rows.push(row);row=[];v=''}else v+=c}row.push(v);if(row.some(x=>x!==''))rows.push(row);const header=rows.shift()||[];return rows.map(r=>Object.fromEntries(header.map((h,i)=>[h,r[i]??''])))}
function renderAllCharts(){const keys=[...new Set(all.flatMap(r=>Object.keys(fields(r))))].filter(k=>!isFree(k)&&!['name','age'].includes(k));$('allcharts').innerHTML=keys.map(k=>'<details><summary>'+esc(label(k))+'</summary><div class="muted">回答内容の集計は上の質問選択から確認できます。</div></details>').join('')}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.hidden=x.id!=='panel-'+b.dataset.tab)}));
const secret=decodeURIComponent(location.hash.replace(/^#/,''));
$('fetch').onclick=async()=>{try{
 if(!secret){$('message').textContent='このURLには閲覧キーがありません。管理者用の専用URLを開いてください。';return}
 $('message').textContent='回答を読み込み中…';
 const res=await fetch('/api/admin/responses',{cache:'no-store',headers:{'Authorization':'Bearer '+secret}});
 if(!res.ok)throw Error('回答を取得できません（HTTP '+res.status+'）。CloudflareのADMIN_KEY設定を確認してください。');
 load(await res.json());
 }catch(e){$('message').textContent=e.message}};
$('search').oninput=render;$('question').onchange=chart;
$('csv').onclick=()=>csv(all);$('filtered').onclick=()=>csv(visible);
$('json').onclick=()=>download('hamapare_responses.json',JSON.stringify(all,null,2),'application/json');
$('alltoggle').onclick=()=>{$('allanswers').hidden=!$('allanswers').hidden;$('alltoggle').textContent=$('allanswers').hidden?'全回答を表示する':'全回答を閉じる';if(!$('allanswers').hidden)showAll()};
window.addEventListener('DOMContentLoaded',()=>{$('fetch').click()});</script></body></html>
