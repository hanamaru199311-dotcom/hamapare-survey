<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ハマパレ｜回答管理</title><style>body{margin:0;background:#f6f2e9;color:#101d40;font-family:-apple-system,BlinkMacSystemFont,sans-serif}header{background:#0d193e;color:#fff;padding:25px 18px;border-bottom:6px solid #54d2c7}main{max-width:1000px;margin:auto;padding:18px}h1{font-size:26px}h2{font-size:19px}.card{background:white;border:2px solid #17244b;border-radius:16px;padding:16px;margin:16px 0;box-shadow:4px 5px #f5a13b}button,input,select{font:inherit;padding:10px;border:1px solid #a8b0c0;border-radius:9px}button{background:#f6a038;border:2px solid #17244b;font-weight:bold}input{width:95%;max-width:350px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid #ddd;padding:10px 5px;text-align:left}tr{cursor:pointer}.muted{color:#60708a;font-size:13px}.scroll{overflow-x:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;line-height:1.7}details{margin:8px 0}summary{cursor:pointer;font-weight:700}</style></head><body><header><div style="color:#f6a038;font-weight:bold;letter-spacing:2px">HAMAPARE 2027</div><h1>回答管理ダッシュボード</h1>回答者・個別回答・参加意向を確認</header><main><p class="muted">氏名を含む回答は、Cloudflare Accessで許可された利用者だけに表示されます。共通パスワードは不要です。</p><div id="status" class="card">回答を読み込んでいます…</div><section id="dashboard" hidden><div class="card"><b id="total"></b> <button id="csv">CSV出力</button><p><input id="search" placeholder="氏名・回答内容を検索"></p></div><div class="card"><h2>回答者一覧</h2><div class="scroll"><table><thead><tr><th>ID</th><th>氏名</th><th>年齢</th><th>JCTI</th><th>回答日時（日本時間）</th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="card" id="detail"><h2>個別回答</h2><p class="muted">回答者をタップすると全設問を表示します。</p></div></section></main><script>
let all=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const text=v=>Array.isArray(v)?v.join('、'):typeof v==='object'?JSON.stringify(v):String(v??'');
function render(){const q=document.getElementById('search').value.toLowerCase();const list=all.filter(r=>[r.name,JSON.stringify(r.answers)].join(' ').toLowerCase().includes(q));document.getElementById('total').textContent=`回答 ${all.length}件 / 表示 ${list.length}件`;document.getElementById('rows').innerHTML=list.map(r=>`<tr data-id="${r.id}"><td>${r.id}</td><td>${esc(r.name)}</td><td>${r.age}</td><td>${esc(r.answers?.jcti)}</td><td>${esc(new Date(r.submitted_at.replace(' ','T')+'Z').toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}))}</td></tr>`).join('');document.querySelectorAll('tr[data-id]').forEach(tr=>tr.addEventListener('click',()=>detail(Number(tr.dataset.id))))}
function detail(id){const r=all.find(x=>x.id===id);if(!r)return;document.getElementById('detail').innerHTML=`<h2>${esc(r.name)}さんの回答</h2>`+Object.entries(r.answers||{}).map(([k,v])=>`<details open><summary>${esc(k)}</summary><div>${esc(text(v))}</div></details>`).join('');document.getElementById('detail').scrollIntoView({behavior:'smooth'})}
function csv(){const keys=[...new Set(all.flatMap(r=>Object.keys(r.answers||{})))];const head=['id','submitted_at','name','age',...keys];const cell=x=>'"'+String(x??'').replace(/"/g,'""')+'"';const lines=[head.map(cell).join(','),...all.map(r=>[r.id,r.submitted_at,r.name,r.age,...keys.map(k=>text(r.answers?.[k]))].map(cell).join(','))];const blob=new Blob(['﻿'+lines.join('
')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hamapare_responses.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
async function load(){try{const res=await fetch('/api/admin/responses',{cache:'no-store'});const data=await res.json();if(!res.ok)throw Error(data.error||'取得失敗');all=data.responses||[];document.getElementById('status').hidden=true;document.getElementById('dashboard').hidden=false;render()}catch(e){document.getElementById('status').textContent='管理者認証または接続設定が未完了です：'+e.message}}
document.getElementById('search').addEventListener('input',render);document.getElementById('csv').addEventListener('click',csv);load();
</script></body></html>
